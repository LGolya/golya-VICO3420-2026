<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Week 7 Assignment</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      color: #4a2d8c;
      margin-bottom: 10px;
    }

    #welcome-message {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #4a2d8c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 8px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #6a4db0;
    }

    #output {
      margin-top: 30px;
      width: 100%;
      max-width: 450px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid #4a2d8c;
      box-shadow: 4px 4px 0px #4a2d8c;
    }

    .card h2 {
      margin: 0 0 8px;
      color: #4a2d8c;
    }

    .card p {
      margin: 4px 0;
      font-size: 15px;
    }
  </style>
    </head>
    <body>

    <h1>Quick Fun(ctions)</h1>
    <p id="welcome-message"></p>

    <button class="btn" onclick="displayWelcomeMessage()">Click me for a welcome message!</button>
    <button class="btn" onclick="greetUser(prompt('Enter your name: '))">Click me to greet you!</button>
    <button class="btn" onclick="showData()">Click me to see some data!</button>

    <div id="output"></div>

    <script>
        function displayWelcomeMessage() {
            document.getElementById("welcome-message").textContent = "Welcome to our website!";
        }

        function greetUser(name) {
            if (name) {
                alert("Hello, " + name + "! Nice to meet you!");
            }
        }

        function buildDataCard(name, job, location) {
            let cardHTML = `<div class='card'>
                <h2>${name}</h2>
                <p>Job: ${job}</p>
                <p>Location: ${location}</p>
            </div>`;
            return cardHTML;
        }

        function showData() {
            let name = prompt("Enter a name:");
            let job = prompt("Enter a job:");
            let location = prompt("Enter a location:");

            if (name && job && location) {
                let cardHTML = buildDataCard(name, job, location);
                document.getElementById("output").innerHTML = cardHTML;
            } else {
                alert("Please fill in all fields to see the data card.");
            }
        }
    </script>
    </body>
</html>
