	<!DOCTYPE html>
	<html lang="en">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>Looking at Functions</title>
        <style>
           


        </style>
	</head>
	<body>

	    <script>

            let givenNumber = 1;

            let numberToAdd = prompt("What number would you like to add to " + givenNumber + "?");

            function addNum(num) {
                givenNumber += Number(num);	
                alert(givenNumber);
    
                return givenNumber;
            }

            addNum(numberToAdd);
        </script>
        
    

	</body>
	</html>
