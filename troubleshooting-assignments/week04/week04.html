<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Some JavaScript in an HTML Page!</title>
        
        <style>
            body {
                font-family: Arial, sans-serif;
            }
        </style>
        
        <script type="application/javascript">

            alert("Please enter answers to the following prompts to see a madlibs story!");
            let street = prompt("Provide a street name.");
            let verb01 = prompt("Provide a verb.");
            let noun01 = prompt("Provide a noun.");
            let question = prompt("Provide a question. Include the question mark.");
            let emotion = prompt("Provide type of feeling.");
            let adjective01 = prompt("Provide a adjective (word to describe something).");
            let dodonot = prompt("Either type \"do\" or \"don't\" below.");
            let noun02 = prompt("Provide a noun.");
            let event = prompt("Provide a type of event.");
            let verb03 = prompt("Provide a verb.");
            let employeeType = prompt("Provide a type of employee.");
            let place = prompt("Provide a place.");
            let verb02 = prompt("Provide a verb.");
            let noun03 = prompt("Provide a noun.");
            let relationship = prompt("Provide a relationship type.");
            let adjective02 = prompt("Provide a adjective (word to describe something).");
        </script>
        
    </head>
    <body>
        <div>Your story:></div>

        <script>
            
            document.getElementById("container").innerHTML = 
            `<p>I was walking down ${street} the other day and a student ${verb01}ing a ${noun01} approached me and asked me, "${question}" I was ${emotion}. I couldn't believe a ${adjective01} person, who was also ${verb02}ing a ${noun02} at the time. I said I ${dodonot} and started walking away since I was late for a ${event} called "${adjective02} ${noun03}". They started following me and started to ${verb03}. I found out they were the ${employeeType} for the event! They snuck me into ${place} and we have been ${relationship} ever since!</p>`;
        
        </script>
        
        <div id="container"></div>
        
        <div>Reload to play again!</div>
    </body>
</html>
