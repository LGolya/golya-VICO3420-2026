</head>
<body>
 
  <!-- NAVBAR -->
  <nav>
    <div class="container">
      <div class="nav-logo">🎨 The Art Cart</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
 
  <main class="page-body">
 
  <!-- PAGE TITLE -->
  <div class="page-title">
    <h1>Contact</h1>
  </div>
 
 
  <!-- CONTACT DETAILS + FORM -->
  <section class="section">
    <div class="container">
 
      <div style="text-align:center; margin-bottom:36px;">
        <p style="margin-bottom:8px;">📞 <strong>Phone:</strong> ((216)347-1882)</p>
        <p style="margin-bottom:8px;">✉️ <strong>Email:</strong> jengolya@theartcart.com</p>
        <p>📍 <strong>Area:</strong> Cleveland, OH</p>
      </div>
 
      <!-- Contact form -->
      <form id="contact-form">
 
        <div>
          <label for="name">Your Name *</label>
          <input type="text" id="name" name="name" placeholder="Jane Smith" required />
        </div>
 
        <div>
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="jane@email.com" required />
        </div>
 
        <div>
          <label for="service">What are you interested in?</label>
          <select id="service" name="service">
            <option value="">— Pick one —</option>
            <option value="window">Window Painting</option>
            <option value="holiday">Hand-painted Personalized Gifts</option>
            <option value="mural">Large Scale Murals</option>
            <option value="event">Special Events</option>
            <option value="other">Not sure yet</option>
          </select>
        </div>
 
        <div>
          <label for="message">Tell me about your project</label>
          <textarea id="message" name="message" placeholder="Describe what you have in mind..."></textarea>
        </div>
 
        <button type="submit" class="btn btn-pink">Send Message</button>
 
      </form>
 
    </div>
  </section>
 
 
  </main>
